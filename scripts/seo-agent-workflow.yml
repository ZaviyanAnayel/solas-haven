name: Autonomous AI SEO Agent

on:
  schedule:
    # Runs every 2 days at 02:00 UTC (cloud cron)
    - cron: '0 2 */2 * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  publish-seo-chronicle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous SEO Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/seo-agent.mjs

      - name: Commit and Push New Article
        run: |
          git config user.name "Solas SEO Agent"
          git config user.email "seo-agent@solashaven.com"
          if [[ -n $(git status -s src/lib/chronicles/seoGeneratedStories.ts) ]]; then
            git add src/lib/chronicles/seoGeneratedStories.ts
            git commit -m "chore(seo): publish autonomous SEO chronicle & ping IndexNow [skip ci]"
            git push
            echo "✅ Successfully committed and deployed new SEO article to production."
          else
            echo "ℹ️ No changes detected."
          fi
